# CI тестов проекта: проверки документации и тесты проверок.
# Решение и границы — docs/design/architecture/adr/0016-ci-triggers-on-pull-request.md.
#
# Сейчас job один и запускается на Ubuntu: тестируются артефакты документации,
# которые от ОС не зависят. Матрица macOS/Windows/Linux (R-03) добавляется вместе
# с кодом приложения в E-01/E-12, а фильтры по путям — вместе со сборкой
# установщиков, чтобы правка docs/ её не запускала (ADR-0013, ADR-0014).
name: CI

on:
  # Только PR в main: push-триггер отменён (ADR-0016), иначе каждый пуш в ветку
  # с открытым PR давал два прогона на один коммит — push и pull_request.
  pull_request:
    branches: [main]
  # Ручной запуск — для ветки без PR и для проверки самого workflow:
  # gh workflow run ci.yml --ref <ветка>
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон: проверяем последний коммит.
# Для pull_request github.ref — refs/pull/N/merge, то есть группа на один PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Секретов и записи в репозиторий job не требует; токен только на чтение.
permissions:
  contents: read

jobs:
  check:
    # Имя job = контекст обязательной проверки в ruleset protect-main (ADR-0015).
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Версия берётся из поля packageManager в корневом package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # E2E запускает Electron: на Ubuntu нужен X-сервер (xvfb) и GTK.
      - name: Install Electron runtime for e2e
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64

      - name: Validate artifacts and run tests
        run: xvfb-run --auto-servernum pnpm check
