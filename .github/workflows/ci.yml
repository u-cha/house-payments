# CI проекта: проверки на трёх ОС и артефакты установщиков (гейт V3).
# Решение — docs/design/architecture/adr/0022-ci-matrix-and-latest-artifacts.md
# (уточняет триггеры ADR-0016); имя артефакта и «последний» — ADR-0018/ADR-0019.
#
# Триггеры: PR в main — обязательный `check` (ruleset protect-main); push в main —
# публикация артефактов latest-* после merge; workflow_dispatch — ручная проверка
# ветки (`gh workflow run ci.yml --ref <ветка>`), тоже собирает артефакты, чтобы
# `pnpm app:latest --run <id>` можно было проверить до merge. «Последним» для
# ручной проверки остаётся только зелёный прогон main (ADR-0018).
#
# Матрица macOS/Windows/Linux проверяет нативную зависимость better-sqlite3 (R-03):
# на каждой ОС она пересобирается под Electron и загружается в Electron.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон: проверяем последний коммит.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Секретов и записи в репозиторий job не требует; токен только на чтение.
permissions:
  contents: read

# Команды одинаковы на трёх ОС: на Windows-раннере шаги идут в Git Bash.
defaults:
  run:
    shell: bash

jobs:
  # Правка только docs/ не запускает тяжёлые сборки. Решение отдельным job: path-
  # фильтры уровня workflow оставили бы обязательный `check` в ожидании.
  changes:
    name: changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: filter
        name: Определить, меняется ли код приложения
        run: |
          set -euo pipefail
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed.txt
            code=false
            if grep -Eq '^(apps/|packages/|\.github/workflows/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)' changed.txt; then
              code=true
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Матрица трёх ОС: install, пересборка better-sqlite3 под Electron (R-03),
  # lint, typecheck, test, build, e2e smoke.
  verify:
    name: verify (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            .cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # E2E запускает Electron: на Ubuntu нужен X-сервер (xvfb) и GTK.
      - name: Install Electron runtime for e2e (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64
      - name: Rebuild better-sqlite3 for Electron (R-03)
        run: pnpm --filter @house-payments/desktop rebuild:native
      - name: Load native dependency in Electron (R-03)
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: pnpm --filter @house-payments/desktop exec electron scripts/check-native.mjs
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm --filter @house-payments/desktop build
      - name: E2E smoke
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: E2E smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e

  # Обязательный контекст ruleset protect-main (ADR-0015/ADR-0016): единственный
  # прогон `pnpm check` и агрегатор итога матрицы. Красная матрица не может дать
  # зелёный `check`; при правке только docs/ матрица пропускается — `check` зелёный.
  check:
    name: check
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Итог матрицы
        run: |
          echo "changes=${{ needs.changes.result }} verify=${{ needs.verify.result }}"
          case "${{ needs.changes.result }}" in success) ;; *) echo "::error::changes неуспешен"; exit 1 ;; esac
          case "${{ needs.verify.result }}" in success | skipped) ;; *) echo "::error::матрица ОС красная"; exit 1 ;; esac
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron runtime for e2e
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64
      - name: Validate artifacts and run tests
        run: xvfb-run --auto-servernum pnpm check

  # Артефакты установщиков трёх ОС под фиксированными именами latest-* (ADR-0018).
  # Публикуются только когда матрица и обязательный `check` зелёные: красный прогон
  # не публикует ничего. Один прогон — один артефакт на ОС; накопление ограничено
  # retention-days, старые прогоны `pnpm app:latest` не читает.
  artifacts:
    name: artifacts (${{ matrix.os }})
    needs: [check, verify]
    if: >-
      needs.verify.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, dist: 'dist:mac', artifact: house-payments-mac-latest }
          - { os: windows-2022, dist: 'dist:win', artifact: house-payments-win-latest }
          - { os: ubuntu-24.04, dist: 'dist:linux', artifact: house-payments-linux-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            .cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild better-sqlite3 for Electron (R-03)
        run: pnpm --filter @house-payments/desktop rebuild:native
      - name: Build installer
        run: pnpm --filter @house-payments/desktop ${{ matrix.dist }}
      - name: Publish latest installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Только установщики: рядом в release/ лежат каталоги распаковки
          # (mac-arm64, win-unpacked, linux-unpacked) — их в артефакт не берём.
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          overwrite: true
          retention-days: 30
