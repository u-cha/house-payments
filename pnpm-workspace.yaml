# pnpm workspace root of the monorepo: the docs tooling lives at the root,
# the desktop app in apps/desktop (M0-01); shared packages arrive later.
packages:
  - apps/*
  - packages/*

# Transitive dependencies declare postinstall scripts we deliberately skip:
# - oracledb (via @dbml/cli) is never used by the docs tooling;
# - puppeteer (via @mermaid-js/mermaid-cli) must not download Chromium:
#   diagram rendering uses the local Chrome path from .tools/puppeteer-config.json;
# - electron-winstaller (via electron-builder) is only needed for Windows/Squirrel,
#   which is out of scope for the macOS draft build (M0-03).
# They are pinned by pnpm-lock.yaml; declaring them here keeps `pnpm install`
# reproducible instead of failing on an interactive approve-builds prompt.
ignoredBuiltDependencies:
  - electron-winstaller
  - oracledb
  - puppeteer

# electron's postinstall downloads the platform binary (M0-02); it is the only
# dependency whose install script we do run.
onlyBuiltDependencies:
  - electron

strictDepBuilds: false
